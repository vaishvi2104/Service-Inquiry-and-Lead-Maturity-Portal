{% if messages %}
<div class="container-xl pt-3">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible shadow-sm fade show" role="alert">
    <div class="d-flex align-items-center">
      <div>
        {% if message.tags == 'success' %}
          <i class="ti ti-circle-check fs-2 me-2"></i>
        {% elif message.tags == 'danger' or message.tags == 'error' %}
          <i class="ti ti-alert-circle fs-2 me-2"></i>
        {% elif message.tags == 'warning' %}
          <i class="ti ti-alert-triangle fs-2 me-2"></i>
        {% else %}
          <i class="ti ti-info-circle fs-2 me-2"></i>
        {% endif %}
      </div>
      <div>{{ message }}</div>
    </div>
    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
  </div>
  {% endfor %}
</div>
{% endif %}
