<header class="navbar navbar-expand-md d-none d-lg-flex d-print-none sticky-top">
  <div class="container-xl">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
      <!-- Theme Toggle (Light / Dark) -->
      <div class="d-none d-md-flex">
        <button type="button" class="btn btn-icon btn-ghost-secondary rounded-circle" onclick="toggleTheme()" title="Toggle Dark/Light Mode" aria-label="Toggle theme">
          <i id="theme-toggle-icon" class="ti ti-moon fs-2"></i>
        </button>
      </div>

      <!-- Quick Add Lead Button -->
      <div class="nav-item d-none d-md-flex">
        <a href="{% url 'dashboard:lead_create' %}" class="btn btn-primary btn-sm d-flex align-items-center gap-1 shadow-sm">
          <i class="ti ti-plus"></i> New Lead
        </a>
      </div>

      <!-- Staff User Profile Dropdown -->
      <div class="nav-item dropdown">
        <a href="#" class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown" aria-label="Open user menu">
          <span class="avatar avatar-sm bg-primary-lt fw-bold">{{ request.user.username|slice:":1"|upper }}</span>
          <div class="d-none d-xl-block ps-2">
            <div>{{ request.user.get_full_name|default:request.user.username }}</div>
            <div class="mt-1 small text-secondary">
              {% if request.user.is_superuser %}Super Administrator{% else %}Staff Advisor{% endif %}
            </div>
          </div>
        </a>
        <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow shadow-sm">
          <div class="dropdown-header">Signed in as <strong>{{ request.user.username }}</strong></div>
          <a href="{% url 'dashboard:profile' %}" class="dropdown-item">
            <i class="ti ti-user me-2"></i> Profile & Settings
          </a>
          <a href="{% url 'dashboard:leads' %}" class="dropdown-item">
            <i class="ti ti-users me-2"></i> My Leads
          </a>
          <div class="dropdown-divider"></div>
          <form method="post" action="{% url 'dashboard:logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="dropdown-item text-danger d-flex align-items-center">
              <i class="ti ti-logout me-2"></i> Sign Out
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Quick Search Header Input -->
    <div class="collapse navbar-collapse" id="navbar-menu">
      <div>
        <form action="{% url 'dashboard:leads' %}" method="get" autocomplete="off" novalidate>
          <div class="input-icon">
            <span class="input-icon-addon">
              <i class="ti ti-search"></i>
            </span>
            <input type="text" name="q" value="{{ search_query|default:'' }}" class="form-control form-control-rounded" placeholder="Search customer, phone, or reference ID…" aria-label="Search leads" style="min-width: 320px;">
          </div>
        </form>
      </div>
    </div>
  </div>
</header>
